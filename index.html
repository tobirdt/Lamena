<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Lamena provides security, safety and communication engineering, consulting and turnkey project support for demanding technical environments."
    />
    <meta name="theme-color" content="#0d0b14" />
    <link rel="canonical" href="https://lamena.ae/" />

    <!-- Fraunces (editorial serif display) + Inter (body) + IBM Plex Mono (rare accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:opsz,wght@14..32,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:url" content="https://lamena.ae/" />
    <meta property="og:title" content="Lamena | Security. Safety. Communication." />
    <meta
      property="og:description"
      content="A modern security, safety and communication consulting partner for organizations where reliability matters."
    />
    <meta property="og:type" content="website" />
    <!-- jpg, not webp: WhatsApp and some crawlers ignore webp og:images -->
    <meta property="og:image" content="https://lamena.ae/assets/visual-security.jpg" />
    <meta property="og:image:alt" content="Lamena security and communication engineering" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Lamena | Security. Safety. Communication.</title>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lamena FZE",
        "url": "https://lamena.ae",
        "logo": "https://lamena.ae/assets/lamena-logo.png",
        "email": "info@lamena.ae",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Office LB19, LB192701WS17 Area 5.92, Jebel Ali Free Zone",
          "addressLocality": "Dubai",
          "addressCountry": "AE"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
